name: Deploy WatchParty Stack

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------
  # JOB 1: TEST GO BACKEND
  # ----------------------------------------------------------------
  test-go:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend-go/go.sum

      - name: Start Pub/Sub Emulator
        run: |
          docker run -d -p 8085:8085 gcr.io/google.com/cloudsdktool/cloud-sdk:emulators gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
          sleep 5 # Give it a few seconds to boot up

      - name: Run Go Tests
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085
          GCP_PROJECT_ID: test-project
        run: |
          cd backend-go
          go mod tidy
          go test -v -tags=integration ./...

  # ----------------------------------------------------------------
  # JOB 2: TEST PYTHON BACKEND
  # ----------------------------------------------------------------
  test-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: watchparty
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
     
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend-python/requirements.txt
      
      - name: Start Pub/Sub Emulator
        run: |
          docker run -d -p 8085:8085 gcr.io/google.com/cloudsdktool/cloud-sdk:emulators gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
          sleep 5

      - name: Install dependencies
        run: |
          cd backend-python
          pip install -r requirements.txt
          pip install pytest pytest-mock responses

      - name: Run Python Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/watchparty
          PYTHONPATH: .
          PUBSUB_EMULATOR_HOST: localhost:8085
          GCP_PROJECT_ID: test-project
        run: |
          cd backend-python
          pytest tests -v

  # ----------------------------------------------------------------
  # JOB 3: DOCKER IMAGES BUILD
  # ----------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Python image
        run: docker build -t watchparty-api:ci ./backend-python
      - name: Build Go image
        run: docker build -t watchparty-ws:ci ./backend-go

  # ----------------------------------------------------------------
  # JOB 4: INFRASTRUCTURE SANITY CHECK
  # ----------------------------------------------------------------
  infrastructure-check:
    needs: [test-go, test-python, docker-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Verify Pub/Sub Configuration
        run: |
          echo "🔍 Checking Pub/Sub Topic..."
          if ! gcloud pubsub topics describe watchparty-events --project=${{ secrets.GCP_PROJECT_ID }} > /dev/null 2>&1; then
            echo "❌ ERROR: Topic 'watchparty-events' not found!"
            exit 1
          fi
          
          echo "🔍 Checking Pub/Sub Subscription..."
          if ! gcloud pubsub subscriptions describe python-backend-sub --project=${{ secrets.GCP_PROJECT_ID }} > /dev/null 2>&1; then
            echo "❌ ERROR: Subscription 'python-backend-sub' not found!"
            exit 1
          fi
          echo "✅ Infrastructure verified."

  # ----------------------------------------------------------------
  # JOB 5: DEPLOY BACKENDS (Requires Tests & Infra Check)
  # ----------------------------------------------------------------
  deploy-backends:
    needs: infrastructure-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      python_url: ${{ steps.resolve-python-api-url.outputs.url }}
      go_url: ${{ steps.resolve-ws-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Authenticate Docker to push to Google Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
      
      # ---------------------------------------------------
      # 🚀 FAST DEPLOY: PYTHON API
      # ---------------------------------------------------
      - name: Build and Push Python Image
        run: |
          cd backend-python
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/watchparty-repo/watchparty-api:latest .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/watchparty-repo/watchparty-api:latest

      - name: Deploy Python to Cloud Run
        id: deploy-python
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: watchparty-api
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/watchparty-repo/watchparty-api:latest
          flags: |
            --port=8080
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            EXTRA_ALLOWED_ORIGINS=https://watchparty-482106.web.app
            REDIS_ADDR=${{ secrets.REDIS_ADDR }}

      - name: Resolve Python API URL (gcloud)
        id: resolve-python-api-url
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe watchparty-api \
            --region=us-central1 \
            --project="${GCP_PROJECT_ID}" \
            --format='value(status.url)')
          echo "Resolved watchparty-api URL: ${URL}"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"

      # ---------------------------------------------------
      # 🚀 FAST DEPLOY: GO WEBSOCKET
      # ---------------------------------------------------
      - name: Build and Push Go Image
        run: |
          cd backend-go
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/watchparty-repo/watchparty-ws:latest .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/watchparty-repo/watchparty-ws:latest

      - name: Deploy Go to Cloud Run
        id: deploy-go
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: watchparty-ws
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/watchparty-repo/watchparty-ws:latest
          flags: |
            --timeout=3600
          env_vars: |
            REDIS_ADDR=${{ secrets.REDIS_ADDR }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            EXTRA_ALLOWED_ORIGINS=https://watchparty-482106.web.app

      - name: Resolve WebSocket service URL (gcloud)
        id: resolve-ws-url
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe watchparty-ws \
            --region=us-central1 \
            --project="${GCP_PROJECT_ID}" \
            --format='value(status.url)')
          echo "Resolved watchparty-ws URL: ${URL}"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"

  # ----------------------------------------------------------------
  # JOB 6: DEPLOY FRONTEND
  # ----------------------------------------------------------------
  deploy-frontend:
    needs: deploy-backends
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build React
        env:
          PYTHON_URL: ${{ needs.deploy-backends.outputs.python_url }}
          GO_URL: ${{ needs.deploy-backends.outputs.go_url }}
          VITE_API_URL_OVERRIDE: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL_OVERRIDE: ${{ secrets.VITE_WS_URL }}
        run: |
          cd frontend/wpfe
          # Defaults: URLs from gcloud run services describe (job outputs). Optional secrets override (e.g. custom domain).
          if [ -n "$VITE_API_URL_OVERRIDE" ]; then
            API_URL="$VITE_API_URL_OVERRIDE"
            echo "VITE_API_URL: using VITE_API_URL secret override"
          else
            API_URL="$PYTHON_URL"
            echo "VITE_API_URL: using gcloud-resolved watchparty-api URL"
          fi
          if [ -n "$VITE_WS_URL_OVERRIDE" ]; then
            WS_URL="$VITE_WS_URL_OVERRIDE"
            echo "VITE_WS_URL: using VITE_WS_URL secret override"
          else
            WS_URL=$(echo "$GO_URL" | sed 's/^https/wss/')
            echo "VITE_WS_URL: using gcloud-resolved watchparty-ws URL (https→wss)"
          fi
          echo "VITE_API_URL=$API_URL" > .env
          echo "VITE_WS_URL=$WS_URL" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          npm install && npm run build
      
      - name: Firebase Deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          cd frontend/wpfe
          firebase deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }} --token "$FIREBASE_TOKEN"