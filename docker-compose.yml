# Local dependencies for integration tests and development.
#   docker compose up -d
#
# Python: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/watchparty
# Go:     REDIS_ADDR=localhost:6379  (default)
# Pub/Sub emulator (optional for Go/Python integration): run separately, e.g.
#   docker run -d -p 8085:8085 gcr.io/google.com/cloudsdktool/cloud-sdk:emulators \
#     gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
#   export PUBSUB_EMULATOR_HOST=localhost:8085 GCP_PROJECT_ID=test-project

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watchparty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d watchparty"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
